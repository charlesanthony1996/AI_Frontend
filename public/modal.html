<div id="myModal" class="modal">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="commentTop">
      <p id="commentText" class="modal-counter"></p>
    </div>
    <div class="content-row">
      <div id="counter-speech">
        <p id="counterSpeechText" class="modal-counter"></p>
      </div>
      <div id="buttons">
        <div id="mood" class="icons">
          <i class="far fa-smile"><span class="tooltiptext">Type</span></i>
        </div>
        <div id="copy" class="icons">
          <i class="fas fa-copy"><span class="tooltiptext">Copy</span></i>
        </div>
        <div id="reply" class="icons">
          <i class="fas fa-reply"><span class="tooltiptext">Reply</span></i>
        </div>
        <div id="explanation" class="icons">
          <i class="fas fa-info-circle"><span class="tooltiptext">Explanation</span></i>
        </div>
      </div>
    </div>
    <div id="button-refresh">
      <button id="generateCounterSpeech" class="modal-btn">Generate Counter Speech</button>
    </div>
  </div>
</div>
<button id="openModalButton" class="open-modal-button"></button>
